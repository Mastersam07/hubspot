name: hubspot
description: "A new Flutter plugin project."
version: 0.1.0
homepage: https://github.com/mastersam/hubspot
repository: https://github.com/mastersam/hubspot
issue_tracker: https://github.com/mastersam/hubspot/issues
documentation: https://github.com/mastersam/hubspot/blob/dev/README.md
topics:
  - hubspot
  - support
  - chat-widget

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  disable-swift-package-manager: false
  plugin:
    platforms:
      android:
        package: tech.mastersam.hubspot
        pluginClass: HubspotPlugin
      ios:
        pluginClass: HubspotPlugin
        disable-swift-package-manager: false